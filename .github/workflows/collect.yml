name: 실거래 수집·알림·배포

on:
  schedule:
    # KST 08:00, 20:00 (UTC 23:00, 11:00)
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      rebuild_complexes:
        description: "단지 마스터 다시 만들기"
        type: boolean
        default: false
      months:
        description: "수집할 YYYYMM 목록(쉼표). 비우면 자동"
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 값은 출력하지 않고 "등록됨/없음"만 확인한다. 빠진 것이 있으면 여기서 바로 멈춘다.
      - name: 설정 확인 (Secret 등록 여부)
        env:
          S_DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY != '' }}
          S_KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY != '' }}
          S_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
          S_PUSH_CONTACT: ${{ secrets.PUSH_CONTACT != '' }}
          S_PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS != '' }}
          V_DATA_GO_KR_KEY: ${{ vars.DATA_GO_KR_KEY != '' }}
          V_KAKAO_REST_KEY: ${{ vars.KAKAO_REST_KEY != '' }}
          V_VAPID_PRIVATE_KEY: ${{ vars.VAPID_PRIVATE_KEY != '' }}
          V_PUSH_CONTACT: ${{ vars.PUSH_CONTACT != '' }}
          V_PUSH_SUBSCRIPTIONS: ${{ vars.PUSH_SUBSCRIPTIONS != '' }}
        run: |
          failed=0
          {
            echo "### 설정 확인"
            echo ""
            echo "| 이름 | 상태 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          check() {
            name="$1"; need="$2"
            s_var="S_$name"; v_var="V_$name"
            if [ "${!s_var}" = "true" ]; then
              msg="✅ 등록됨"
            elif [ "${!v_var}" = "true" ]; then
              msg="❌ Variables 탭에 들어 있음. Secrets 탭으로 옮겨야 함"
              echo "::error::$name 이 Secret 이 아니라 Variable 로 등록되어 있습니다. Variables 탭에서 지우고 Secrets 탭에 다시 등록하세요."
              failed=1
            elif [ "$need" = "required" ]; then
              msg="❌ 없음 (수집에 꼭 필요)"
              echo "::error::Secret $name 을 찾을 수 없습니다. Settings > Secrets and variables > Actions > Secrets 탭 > Repository secrets 에 이 이름 그대로 등록되어 있는지 확인하세요."
              failed=1
            else
              msg="⚠️ 없음 (알림 발송에만 필요, 수집은 계속 진행)"
              echo "::warning::Secret $name 이 없습니다. 수집은 되지만 웹 푸시 알림은 보내지 않습니다."
            fi
            echo "$name: $msg"
            echo "| \`$name\` | $msg |" >> "$GITHUB_STEP_SUMMARY"
          }
          check DATA_GO_KR_KEY required
          check KAKAO_REST_KEY required
          check VAPID_PRIVATE_KEY optional
          check PUSH_CONTACT optional
          check PUSH_SUBSCRIPTIONS optional
          if [ "$failed" = "1" ]; then
            {
              echo ""
              echo "필수 값이 빠져 실행을 멈췄습니다. 자주 생기는 실수:"
              echo "- **Actions** 가 아니라 Codespaces 나 Dependabot 메뉴에 등록함"
              echo "- **Secrets** 탭이 아니라 Variables 탭에 등록함"
              echo "- 이름의 철자나 밑줄이 다름 (대문자와 밑줄만 사용)"
              echo "- github-pages 가 아닌 다른 Environment 의 secret 으로 등록함"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 단지 마스터 생성 (없거나 요청 시)
        if: ${{ inputs.rebuild_complexes || hashFiles('data/complexes.json') == '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python -m collector.main complexes

      - name: 실거래 수집 + 변화 감지 + 요약
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -n "${{ inputs.months }}" ]; then
            python -m collector.main collect --months "${{ inputs.months }}"
          else
            python -m collector.main collect
          fi

      - name: 웹 푸시 발송
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_CONTACT: ${{ secrets.PUSH_CONTACT }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python -m collector.main notify

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
            git push
          fi

      - name: 사이트 빌드
        run: scripts/build_site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
