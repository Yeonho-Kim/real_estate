name: 실거래 수집·알림·배포

on:
  schedule:
    # KST 08:00, 20:00 (UTC 23:00, 11:00)
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      rebuild_complexes:
        description: "단지 마스터 다시 만들기"
        type: boolean
        default: false
      months:
        description: "수집할 YYYYMM 목록(쉼표). 비우면 자동"
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 단지 마스터 생성 (없거나 요청 시)
        if: ${{ inputs.rebuild_complexes || hashFiles('data/complexes.json') == '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python -m collector.main complexes

      - name: 실거래 수집 + 변화 감지 + 요약
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -n "${{ inputs.months }}" ]; then
            python -m collector.main collect --months "${{ inputs.months }}"
          else
            python -m collector.main collect
          fi

      - name: 웹 푸시 발송
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_CONTACT: ${{ secrets.PUSH_CONTACT }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python -m collector.main notify

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
            git push
          fi

      - name: 사이트 빌드
        run: scripts/build_site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
